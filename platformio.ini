; Host-based unit tests for the platform-independent master engine.
; Real ESP32/S3/C3 targets build against src/hal/OgrEsp32Transport.*, which
; this native env doesn't compile (it depends on Arduino's Wire).
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags = -std=gnu++14 -Wall -Wextra
build_src_filter = +<*> -<hal/*>
monitor_speed = 115200